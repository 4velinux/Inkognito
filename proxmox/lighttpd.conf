# Inkognito web server config (Proxmox Alpine LXC).
# Serves one static file with strict privacy headers.

server.modules = ( "mod_access", "mod_setenv" )

server.document-root = "/var/www/inkognito"
server.port          = 80
server.username      = "lighttpd"
server.groupname     = "lighttpd"
server.pid-file      = "/run/lighttpd.pid"
server.errorlog      = "/var/log/lighttpd/error.log"
server.tag           = "inkognito"

index-file.names = ( "index.html" )
url.access-deny  = ( "~", ".bak", ".conf" )

mimetype.assign = (
  ".html"   => "text/html; charset=utf-8",
  ".txt"    => "text/plain; charset=utf-8",
  ".sha256" => "text/plain; charset=utf-8"
)

setenv.add-response-header = (
  "Cache-Control"           => "no-cache",
  "X-Content-Type-Options"  => "nosniff",
  "X-Frame-Options"         => "DENY",
  "Referrer-Policy"         => "no-referrer",
  "Permissions-Policy"      => "camera=(), microphone=(), geolocation=(), payment=(), usb=()",
  "Cross-Origin-Opener-Policy" => "same-origin",
  "Content-Security-Policy" => "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"
)
