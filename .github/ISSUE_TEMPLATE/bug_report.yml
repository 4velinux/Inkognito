name: Bug report
description: Something looks or behaves wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Please do not paste private drafts. A made-up example that shows the problem is perfect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 19 on iPhone 16, Chrome 140 on Windows 11
  - type: dropdown
    id: where
    attributes:
      label: How you run Inkognito
      options: [Opened the file directly, Proxmox LXC, Docker, Other]
  - type: input
    id: version
    attributes:
      label: Version (bottom right of the app)
      placeholder: v1.0.0
