name: Release

# Publish a release in the GitHub UI (tag v1.2.0, matching var VERSION in
# inkognito.html), or push that tag. This workflow attaches the app, its
# SHA-256 checksum, and builds the container image. Self-hosted installs pick
# the new version up on their next update check.
on:
  release:
    types: [published]
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches app version
        run: |
          v=$(sed -n "s/.*var VERSION='\([^']*\)'.*/\1/p" inkognito.html | head -n1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME but inkognito.html says v$v"; exit 1; }
      - name: Privacy guard
        run: sudo apt-get install -y -qq shellcheck >/dev/null && bash scripts/check.sh
      - name: Checksum
        run: sha256sum inkognito.html > inkognito.html.sha256 && cat inkognito.html.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" inkognito.html inkognito.html.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" inkognito.html inkognito.html.sha256 \
              --title "Inkognito $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

  image:
    name: Container image (ghcr.io)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name in lowercase
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=A locally launched, privacy-first LinkedIn formatter for self-hosting.
            org.opencontainers.image.licenses=MIT
