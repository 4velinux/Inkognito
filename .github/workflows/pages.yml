name: Deploy to GitHub Pages

# Publishes inkognito.html to GitHub Pages, at the repo's Pages URL, as
# index.html. Runs the same privacy guard as CI first, so nothing that
# fails scripts/check.sh ever goes live.
#
# One-time setup (repo owner, not this workflow): Settings → Pages →
# "Build and deployment" → Source → "GitHub Actions". After that this
# workflow deploys automatically on every push to main that touches
# inkognito.html, or on demand from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - 'inkognito.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Privacy guard
        run: sudo apt-get install -y -qq shellcheck >/dev/null && bash scripts/check.sh
      - name: Build the site (single page, served as index.html)
        run: |
          mkdir -p _site
          cp inkognito.html _site/index.html
          cp inkognito.html _site/inkognito.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
